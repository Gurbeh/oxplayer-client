# Android-only in CI (Linux build + AppImage + Linux release assets removed from this workflow). Web omitted (fvp/ffi). Windows omitted (media_kit native extract flaky on GHA).
# Push to main → nightly (create_release runs). PRs → development (no GitHub Release).
name: Build OXPlayer

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:
    paths:
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/build.yml
      - .github/actions/**
      - .fvmrc
    types:
      - opened
      - reopened
      - synchronize
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type (release, nightly)"
        required: false
        default: "nightly"
        type: choice
        options:
          - release
          - nightly

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NIGHTLY_TAG: nightly
  # Set true when Play upload signing is ready (release_play_console job).
  UPLOAD_TO_GOOGLE_PLAY: false

jobs:
  check-trigger:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      build_type: ${{ steps.check.outputs.build_type }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: check
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BUILD_TYPE="${{ github.event.inputs.build_type }}"
          elif [[ "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" ]]; then
            BUILD_TYPE="release"
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            git checkout main
            COMMITS_LAST_24H=$(git log --since="24 hours ago" --oneline | wc -l)
            if [[ $COMMITS_LAST_24H -gt 0 ]]; then
              BUILD_TYPE="nightly"
            else
              echo "No commits to main in the last 24 hours, skipping nightly build"
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BUILD_TYPE="development"
          elif [[ "${{ github.event_name }}" == "push" ]] && [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            BUILD_TYPE="nightly"
          else
            BUILD_TYPE="development"
          fi

          echo "build_type=${BUILD_TYPE}" >> "$GITHUB_OUTPUT"
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "Build type determined: ${BUILD_TYPE}"

  fetch-info:
    needs: [check-trigger]
    if: needs.check-trigger.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.fetch.outputs.version_name }}
      version_code: ${{ steps.fetch.outputs.version_code }}
      flutter_version: ${{ steps.fetch.outputs.flutter_version }}
      nightly_version: ${{ steps.fetch.outputs.nightly_version }}
      build_type: ${{ needs.check-trigger.outputs.build_type }}
    steps:
      # Shallow clone: only pubspec.yaml + .fvmrc are read (avoids noisy full-history fetch).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - id: fetch
        shell: bash
        run: |
          VERSION_LINE=$(grep '^version:' pubspec.yaml | cut -d ':' -f2 | tr -d ' ')
          VERSION_NAME="${VERSION_LINE%%+*}"
          VERSION_CODE="${VERSION_LINE#*+}"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

          FLUTTER_VERSION=$(jq -r '.flutter' .fvmrc)
          echo "flutter_version=${FLUTTER_VERSION}" >> "$GITHUB_OUTPUT"

          if [[ "${{ needs.check-trigger.outputs.build_type }}" == "nightly" ]]; then
            NIGHTLY_VERSION="${VERSION_NAME}-nightly"
            echo "nightly_version=${NIGHTLY_VERSION}" >> "$GITHUB_OUTPUT"
            echo "Nightly version: $NIGHTLY_VERSION"
          else
            echo "nightly_version=" >> "$GITHUB_OUTPUT"
          fi

          echo "Base version: $VERSION_NAME"
          echo "Version code: $VERSION_CODE"
          echo "Flutter version: $FLUTTER_VERSION"

  build-android:
    needs: [fetch-info]
    runs-on: ubuntu-latest
    outputs:
      artifact_suffix: ${{ steps.meta.outputs.artifact_suffix }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID || vars.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH || vars.TELEGRAM_API_HASH }}
      BOT_USERNAME: ${{ secrets.BOT_USERNAME || vars.BOT_USERNAME }}
      OXPLAYER_API_BASE_URL: ${{ secrets.OXPLAYER_API_BASE_URL || vars.OXPLAYER_API_BASE_URL }}
      OXPLAYER_TELEGRAM_WEBAPP_SHORT_NAME: ${{ secrets.OXPLAYER_TELEGRAM_WEBAPP_SHORT_NAME || vars.OXPLAYER_TELEGRAM_WEBAPP_SHORT_NAME }}
      OXPLAYER_TELEGRAM_WEBAPP_URL: ${{ secrets.OXPLAYER_TELEGRAM_WEBAPP_URL || vars.OXPLAYER_TELEGRAM_WEBAPP_URL }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN || vars.SENTRY_DSN }}
      SENTRY_ENVIRONMENT: ${{ secrets.SENTRY_ENVIRONMENT || vars.SENTRY_ENVIRONMENT }}
      SENTRY_TRACES_SAMPLE_RATE: ${{ secrets.SENTRY_TRACES_SAMPLE_RATE || vars.SENTRY_TRACES_SAMPLE_RATE }}
      SENTRY_PROFILES_SAMPLE_RATE: ${{ secrets.SENTRY_PROFILES_SAMPLE_RATE || vars.SENTRY_PROFILES_SAMPLE_RATE }}
      SENTRY_DEBUG: ${{ secrets.SENTRY_DEBUG || vars.SENTRY_DEBUG }}
    steps:
      # Full history so sentry_dart_plugin can associate commits with releases (see pubspec ignore_missing).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: meta
        shell: bash
        run: echo "artifact_suffix=${{ needs.fetch-info.outputs.build_type }}" >> "$GITHUB_OUTPUT"

      - name: Configure Android signing
        if: needs.fetch-info.outputs.build_type != 'development'
        shell: bash
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || \
             [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] || \
             [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ] || \
             [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            echo "Signing secrets incomplete — cannot produce signed release APK/AAB."
            exit 1
          fi

          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

          cat > android/app/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          EOF

          if ! keytool -list -keystore android/app/keystore.jks \
               -alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
               -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
               -keypass "${{ secrets.ANDROID_KEY_PASSWORD }}" >/dev/null 2>&1; then
            echo "Keystore validation failed."
            rm -f android/app/keystore.jks android/app/key.properties
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ needs.fetch-info.outputs.flutter_version }}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - run: flutter pub get

      - uses: ./.github/actions/oxplayer-flutter-env

      - name: Build Android (development)
        if: needs.fetch-info.outputs.build_type == 'development'
        run: |
          flutter build apk --debug --split-per-abi \
            --flavor production \
            --build-name=${{ needs.fetch-info.outputs.version_name }} \
            --build-number=${{ needs.fetch-info.outputs.version_code }} \
            --dart-define-from-file="$FLUTTER_BUILD_ENV_FILE"

      - name: Build Android (release)
        if: needs.fetch-info.outputs.build_type != 'development'
        run: |
          flutter build apk --release --split-per-abi \
            --split-debug-info=build/debug-info \
            --flavor production \
            --build-name=${{ needs.fetch-info.outputs.version_name }} \
            --build-number=${{ needs.fetch-info.outputs.version_code }} \
            --dart-define-from-file="$FLUTTER_BUILD_ENV_FILE"
          flutter build appbundle --release \
            --split-debug-info=build/debug-info \
            --flavor production \
            --build-name=${{ needs.fetch-info.outputs.version_name }} \
            --build-number=${{ needs.fetch-info.outputs.version_code }} \
            --dart-define-from-file="$FLUTTER_BUILD_ENV_FILE"

      - name: Upload debug symbols to Sentry
        if: needs.fetch-info.outputs.build_type != 'development'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_RELEASE: oxplayer-client@${{ needs.fetch-info.outputs.version_name }}+${{ needs.fetch-info.outputs.version_code }}
          SENTRY_DIST: ${{ needs.fetch-info.outputs.version_code }}
        run: dart run sentry_dart_plugin

      - name: Verify native ABI parity (Play 64-bit / no x86)
        if: needs.fetch-info.outputs.build_type != 'development'
        run: |
          set -euo pipefail
          AAB="build/app/outputs/bundle/productionRelease/app-production-release.aab"
          test -f "$AAB"
          dart run tool/android/verify_native_abi_parity.dart --aab "$AAB"

      - name: Clean up keystore
        if: always()
        run: rm -f android/app/keystore.jks android/app/key.properties

      - name: Collect Android artifacts (development)
        if: needs.fetch-info.outputs.build_type == 'development'
        shell: bash
        run: |
          mkdir -p build/app/outputs/android_artifacts
          SUF="${{ steps.meta.outputs.artifact_suffix }}"
          cp "build/app/outputs/flutter-apk/app-armeabi-v7a-production-debug.apk" "build/app/outputs/android_artifacts/${SUF}-armeabi-v7a.apk"
          cp "build/app/outputs/flutter-apk/app-arm64-v8a-production-debug.apk" "build/app/outputs/android_artifacts/${SUF}-arm64-v8a.apk"
          cp "build/app/outputs/flutter-apk/app-x86_64-production-debug.apk" "build/app/outputs/android_artifacts/${SUF}-x86_64.apk"

      - name: Collect Android artifacts (release)
        if: needs.fetch-info.outputs.build_type != 'development'
        shell: bash
        run: |
          mkdir -p build/app/outputs/android_artifacts
          SUF="${{ steps.meta.outputs.artifact_suffix }}"
          cp "build/app/outputs/flutter-apk/app-armeabi-v7a-production-release.apk" "build/app/outputs/android_artifacts/${SUF}-armeabi-v7a.apk"
          cp "build/app/outputs/flutter-apk/app-arm64-v8a-production-release.apk" "build/app/outputs/android_artifacts/${SUF}-arm64-v8a.apk"
          cp "build/app/outputs/flutter-apk/app-x86_64-production-release.apk" "build/app/outputs/android_artifacts/${SUF}-x86_64.apk"
          mv "build/app/outputs/bundle/productionRelease/app-production-release.aab" "build/app/outputs/android_artifacts/${SUF}.aab"

      - name: Attest APKs
        if: needs.fetch-info.outputs.build_type != 'development'
        uses: actions/attest@v4
        with:
          subject-path: |
            build/app/outputs/android_artifacts/${{ steps.meta.outputs.artifact_suffix }}-arm64-v8a.apk
            build/app/outputs/android_artifacts/${{ steps.meta.outputs.artifact_suffix }}-armeabi-v7a.apk
            build/app/outputs/android_artifacts/${{ steps.meta.outputs.artifact_suffix }}-x86_64.apk

      - uses: actions/upload-artifact@v5
        with:
          name: oxplayer-android
          path: build/app/outputs/android_artifacts/

  create_release:
    name: Create release
    needs:
      - fetch-info
      - build-android
    runs-on: ubuntu-latest
    if: needs.fetch-info.outputs.build_type == 'release' || needs.fetch-info.outputs.build_type == 'nightly'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        if: needs.fetch-info.outputs.build_type == 'nightly'
        with:
          fetch-depth: 0

      - id: version
        shell: bash
        run: |
          if [[ "${{ needs.fetch-info.outputs.build_type }}" == "nightly" ]]; then
            echo "version=${{ needs.fetch-info.outputs.nightly_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ needs.fetch-info.outputs.version_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete existing nightly release
        if: needs.fetch-info.outputs.build_type == 'nightly'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if gh release view ${{ env.NIGHTLY_TAG }} >/dev/null 2>&1; then
            gh release delete ${{ env.NIGHTLY_TAG }} --yes --cleanup-tag
          fi
          if git tag -l | grep -q "^${{ env.NIGHTLY_TAG }}$"; then
            git push origin --delete ${{ env.NIGHTLY_TAG }} || true
          fi

      - name: Generate nightly changelog
        if: needs.fetch-info.outputs.build_type == 'nightly'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          LATEST_STABLE=$(gh release list --limit 50 --exclude-drafts --json tagName,isPrerelease --jq '.[] | select(.isPrerelease == false) | .tagName' | head -1 || echo "")
          {
            echo "# $(date -u "+%Y-%m-%d %H:%M:%S UTC")"
            echo ""
            echo "Automated nightly build from \`main\`."
            echo ""
            echo "**Warning:** prerelease; may be unstable."
            echo ""
          } > changelog.md
          if [ -n "$LATEST_STABLE" ]; then
            echo "Changes since ${LATEST_STABLE}: https://github.com/${{ github.repository }}/compare/${LATEST_STABLE}...HEAD" >> changelog.md
          else
            echo "Commits: https://github.com/${{ github.repository }}/commits/main" >> changelog.md
          fi
          {
            echo ""
            echo "---"
            echo "Build: ${{ github.run_number }} | SHA: ${{ github.sha }}"
          } >> changelog.md

      - uses: actions/download-artifact@v5
        with:
          name: oxplayer-android
          path: oxplayer-android

      - name: Stage Android assets
        shell: bash
        run: |
          SUF="${{ needs.build-android.outputs.artifact_suffix }}"
          V="${{ steps.version.outputs.version }}"
          mv "oxplayer-android/${SUF}-armeabi-v7a.apk" "OXPlayer-Android-${V}-armeabi-v7a.apk"
          mv "oxplayer-android/${SUF}-arm64-v8a.apk" "OXPlayer-Android-${V}-arm64-v8a.apk"
          mv "oxplayer-android/${SUF}-x86_64.apk" "OXPlayer-Android-${V}-x86_64.apk"
          mv "oxplayer-android/${SUF}.aab" "OXPlayer-Android-${V}.aab"

      - name: Prepare GitHub release body file
        shell: bash
        run: |
          if [[ "${{ needs.fetch-info.outputs.build_type }}" == "nightly" ]]; then
            cp changelog.md gh-release-body.md
          else
            printf '%s\n' "" > gh-release-body.md
          fi

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.fetch-info.outputs.build_type == 'nightly' && env.NIGHTLY_TAG || github.ref_name }}
          name: ${{ needs.fetch-info.outputs.build_type == 'nightly' && format('OXPlayer nightly — {0}', steps.version.outputs.version) || format('OXPlayer {0}', steps.version.outputs.version) }}
          body_path: gh-release-body.md
          draft: ${{ needs.fetch-info.outputs.build_type == 'release' }}
          prerelease: ${{ needs.fetch-info.outputs.build_type == 'nightly' }}
          make_latest: ${{ needs.fetch-info.outputs.build_type == 'release' }}
          generate_release_notes: ${{ needs.fetch-info.outputs.build_type == 'release' }}
          fail_on_unmatched_files: true
          files: |
            OXPlayer-Android-${{ steps.version.outputs.version }}-arm64-v8a.apk
            OXPlayer-Android-${{ steps.version.outputs.version }}-armeabi-v7a.apk
            OXPlayer-Android-${{ steps.version.outputs.version }}-x86_64.apk
            OXPlayer-Android-${{ steps.version.outputs.version }}.aab
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Notify admins (Telegram via oxplayer API)
        if: success()
        env:
          API_BASE: ${{ secrets.OXPLAYER_API_BASE_URL || vars.OXPLAYER_API_BASE_URL }}
          NOTIFY_TOKEN_PRIMARY: ${{ secrets.OXPLAYER_CLIENT_RELEASE_NOTIFY_TOKEN }}
          NOTIFY_TOKEN_FALLBACK: ${{ secrets.PROVIDER_INTERNAL_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BUILD_TYPE: ${{ needs.fetch-info.outputs.build_type }}
        shell: bash
        run: |
          NOTIFY_TOKEN="${NOTIFY_TOKEN_PRIMARY:-${NOTIFY_TOKEN_FALLBACK}}"
          if [ -z "${API_BASE}" ] || [ -z "${NOTIFY_TOKEN}" ]; then
            echo "Skipping admin release notify (set OXPLAYER_API_BASE_URL and OXPLAYER_CLIENT_RELEASE_NOTIFY_TOKEN or PROVIDER_INTERNAL_TOKEN)."
            exit 0
          fi
          if [[ "${BUILD_TYPE}" == "nightly" ]]; then
            TAG="${{ env.NIGHTLY_TAG }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          BASE="${API_BASE%/}"
          if ! JSON=$(gh release view "${TAG}" --repo "${REPO}" --json url,name,assets 2>/tmp/gh-release-view.err); then
            echo "::warning::Could not read release ${TAG} from GitHub: $(cat /tmp/gh-release-view.err)"
            echo "If this persists, remove any repository secret named GITHUB_TOKEN (it overrides the workflow token)."
            exit 0
          fi
          RELEASE_URL=$(echo "$JSON" | jq -r .url)
          RELEASE_NAME=$(echo "$JSON" | jq -r .name)
          ASSETS=$(echo "$JSON" | jq -c '[.assets[] | {name:.name, url:.url}]')
          BODY=$(jq -n \
            --arg releaseUrl "$RELEASE_URL" \
            --arg releaseTag "$TAG" \
            --arg releaseTitle "$RELEASE_NAME" \
            --arg buildType "$BUILD_TYPE" \
            --arg repository "$REPO" \
            --argjson assets "$ASSETS" \
            '{releaseUrl:$releaseUrl, releaseTag:$releaseTag, releaseTitle:$releaseTitle, buildType:$buildType, repository:$repository, assets:$assets}')
          HTTP_CODE=$(curl -sS -o /tmp/ox-release-notify.json -w "%{http_code}" -X POST \
            "${BASE}/internal/oxplayer-client/release-admin-notify" \
            -H "Authorization: Bearer ${NOTIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          NOTIFY_OK=$(jq -r '.ok // false' /tmp/ox-release-notify.json 2>/dev/null || echo false)
          if [ "$HTTP_CODE" != "200" ] || [ "$NOTIFY_OK" != "true" ]; then
            echo "::warning::Admin Telegram notify failed (HTTP ${HTTP_CODE}): $(cat /tmp/ox-release-notify.json)"
            echo "Release published; fix TELEGRAM_MAIN_BOT_TOKEN / admin /start with main bot, or set SUPERADMIN_ID on API."
          else
            echo "Admin release notify sent."
          fi

  release_play_console:
    name: Upload AAB to Google Play
    needs:
      - fetch-info
      - create_release
      - build-android
    runs-on: ubuntu-latest
    # Disabled while Play upload key / signing is being rotated — set env UPLOAD_TO_GOOGLE_PLAY: true to re-enable.
    if: >-
      (vars.UPLOAD_TO_GOOGLE_PLAY == 'true' || env.UPLOAD_TO_GOOGLE_PLAY == 'true')
      && needs.fetch-info.outputs.build_type != 'development'
    concurrency:
      group: google-play-upload-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - id: play_secret
        name: Check Play service account secret
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          if [ -n "$SERVICE_ACCOUNT_JSON" ]; then
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Play upload (SERVICE_ACCOUNT_JSON not set)."
          fi

      - uses: actions/download-artifact@v5
        if: steps.play_secret.outputs.has_secret == 'true'
        with:
          name: oxplayer-android
          path: oxplayer-android

      - name: Upload AAB to Google Play Console
        if: steps.play_secret.outputs.has_secret == 'true'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: "de.aryanmo.oxplayer"
          releaseFiles: "oxplayer-android/${{ needs.build-android.outputs.artifact_suffix }}.aab"
          track: ${{ needs.fetch-info.outputs.build_type == 'nightly' && 'internal' || 'production' }}
          status: ${{ needs.fetch-info.outputs.build_type == 'nightly' && 'completed' || 'draft' }}
          releaseName: "${{ needs.fetch-info.outputs.version_code }} (${{ needs.fetch-info.outputs.version_name }})"

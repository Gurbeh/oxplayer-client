# Multi-platform CI aligned with upstream Fladder (DonutWare/fladder).
# Tag v* → release. Schedule / workflow_dispatch → nightly. PR → development (Android only).
# Branch `multi-app`: full platform matrix on every run (test branch).
# Release/nightly: Android, Windows, iOS, macOS, Linux (+ AppImage, Flatpak on release).
# Web/Docker/Pages deferred until web/ is restored on main.
# OX additions: oxplayer-flutter-env, Sentry symbols, Play package app.oxplayer, admin Telegram notify.
name: Build OXPlayer

on:
  push:
    tags:
      - "v*"
    branches:
      - main
      - multi-app
  pull_request:
    paths:
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/build.yml
      - .github/actions/**
      - .fvmrc
    types:
      - opened
      - reopened
      - synchronize
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type (release, nightly)"
        required: false
        default: "nightly"
        type: choice
        options:
          - release
          - nightly

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NIGHTLY_TAG: nightly
  # Test branch: run Windows/iOS/macOS/Linux/Flatpak even on PR/development builds.
  FULL_MATRIX_BRANCH: multi-app

jobs:
  check-trigger:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      build_type: ${{ steps.check.outputs.build_type }}
      build_all_platforms: ${{ steps.check.outputs.build_all_platforms }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: check
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BUILD_TYPE="${{ github.event.inputs.build_type }}"
          elif [[ "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" ]]; then
            BUILD_TYPE="release"
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            git checkout main
            COMMITS_LAST_24H=$(git log --since="24 hours ago" --oneline | wc -l)
            if [[ $COMMITS_LAST_24H -gt 0 ]]; then
              BUILD_TYPE="nightly"
            else
              echo "No commits to main in the last 24 hours, skipping nightly build"
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BUILD_TYPE="development"
          elif [[ "${{ github.event_name }}" == "push" ]] && [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            BUILD_TYPE="nightly"
          else
            BUILD_TYPE="development"
          fi

          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          if [[ "$BRANCH" == "${{ env.FULL_MATRIX_BRANCH }}" ]]; then
            echo "build_all_platforms=true" >> "$GITHUB_OUTPUT"
            echo "Full platform matrix enabled for branch: ${BRANCH}"
          else
            echo "build_all_platforms=false" >> "$GITHUB_OUTPUT"
          fi

          echo "build_type=${BUILD_TYPE}" >> "$GITHUB_OUTPUT"
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "Build type determined: ${BUILD_TYPE}"

  fetch-info:
    needs: [check-trigger]
    if: needs.check-trigger.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.fetch.outputs.version_name }}
      android_version_code: ${{ steps.fetch.outputs.android_version_code }}
      flutter_version: ${{ steps.fetch.outputs.flutter_version }}
      nightly_version: ${{ steps.fetch.outputs.nightly_version }}
      build_type: ${{ needs.check-trigger.outputs.build_type }}
      build_all_platforms: ${{ needs.check-trigger.outputs.build_all_platforms }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: fetch
        shell: bash
        run: |
          VERSION_NAME=$(grep '^version:' pubspec.yaml | cut -d ':' -f2 | cut -d '+' -f1 | tr -d ' ')
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

          FLUTTER_VERSION=$(jq -r '.flutter' .fvmrc)
          echo "flutter_version=${FLUTTER_VERSION}" >> "$GITHUB_OUTPUT"

          if [[ "${{ needs.check-trigger.outputs.build_type }}" == "nightly" ]]; then
            NIGHTLY_VERSION="${VERSION_NAME}-nightly"
            echo "nightly_version=${NIGHTLY_VERSION}" >> "$GITHUB_OUTPUT"
            echo "Nightly version: $NIGHTLY_VERSION"
          else
            echo "nightly_version=" >> "$GITHUB_OUTPUT"
          fi

          # Must exceed legacy split-APK versionCodes on Play (base*1000+abi) and pubspec-era +N codes.
          ANDROID_VERSION_CODE=$((10000 + ${GITHUB_RUN_NUMBER}))
          echo "android_version_code=${ANDROID_VERSION_CODE}" >> "$GITHUB_OUTPUT"

          echo "Base version: $VERSION_NAME"
          echo "Flutter version: $FLUTTER_VERSION"
          echo "Android versionCode: ${ANDROID_VERSION_CODE}"

  build-android:
    needs: [fetch-info]
    runs-on: ubuntu-latest
    outputs:
      artifact_suffix: ${{ steps.meta.outputs.artifact_suffix }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      BOT_USERNAME: ${{ secrets.BOT_USERNAME || vars.BOT_USERNAME }}
      OXPLAYER_API_BASE_URL: ${{ secrets.OXPLAYER_API_BASE_URL || vars.OXPLAYER_API_BASE_URL }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_ENVIRONMENT: ${{ needs.fetch-info.outputs.build_type == 'development' && 'development' || 'production' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: meta
        shell: bash
        run: echo "artifact_suffix=${{ needs.fetch-info.outputs.build_type }}" >> "$GITHUB_OUTPUT"

      - name: Configure Android signing
        if: needs.fetch-info.outputs.build_type != 'development' || needs.fetch-info.outputs.build_all_platforms == 'true'
        shell: bash
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || \
             [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] || \
             [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ] || \
             [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            echo "Signing secrets incomplete — cannot produce signed release APK/AAB."
            exit 1
          fi

          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

          cat > android/app/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          EOF

      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ needs.fetch-info.outputs.flutter_version }}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - run: flutter pub get

      - uses: ./.github/actions/oxplayer-flutter-env

      - name: Build Android APK (PRs)
        if: needs.fetch-info.outputs.build_type == 'development'
        run: |
          flutter build apk --debug --split-per-abi \
            --build-number=${{ needs.fetch-info.outputs.android_version_code }} \
            --flavor production \
            --dart-define-from-file="$FLUTTER_BUILD_ENV_FILE"

      - name: Build Android APK and AAB
        if: needs.fetch-info.outputs.build_type != 'development' || needs.fetch-info.outputs.build_all_platforms == 'true'
        run: |
          flutter build apk --release --split-per-abi \
            --split-debug-info=build/debug-info \
            --build-number=${{ needs.fetch-info.outputs.android_version_code }} \
            --flavor production \
            --dart-define-from-file="$FLUTTER_BUILD_ENV_FILE"
          flutter build appbundle --release \
            --split-debug-info=build/debug-info \
            --build-number=${{ needs.fetch-info.outputs.android_version_code }} \
            --flavor production \
            --dart-define-from-file="$FLUTTER_BUILD_ENV_FILE"

      - name: Upload debug symbols to Sentry
        if: needs.fetch-info.outputs.build_type != 'development' || needs.fetch-info.outputs.build_all_platforms == 'true'
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_RELEASE: oxplayer-client@${{ needs.fetch-info.outputs.version_name }}+${{ needs.fetch-info.outputs.android_version_code }}
          SENTRY_DIST: ${{ needs.fetch-info.outputs.android_version_code }}
        run: dart run sentry_dart_plugin

      - name: Verify native ABI parity (Play 64-bit / no x86)
        if: needs.fetch-info.outputs.build_type != 'development' || needs.fetch-info.outputs.build_all_platforms == 'true'
        run: |
          set -euo pipefail
          AAB="build/app/outputs/bundle/productionRelease/app-production-release.aab"
          test -f "$AAB"
          dart run tool/android/verify_native_abi_parity.dart --aab "$AAB"

      - name: Clean up keystore
        if: always()
        run: rm -f android/app/keystore.jks android/app/key.properties

      - name: Collect Android artifacts (development)
        if: needs.fetch-info.outputs.build_type == 'development'
        shell: bash
        run: |
          mkdir -p build/app/outputs/android_artifacts
          SUF="${{ steps.meta.outputs.artifact_suffix }}"
          cp "build/app/outputs/flutter-apk/app-armeabi-v7a-production-debug.apk" "build/app/outputs/android_artifacts/${SUF}-armeabi-v7a.apk" || true
          cp "build/app/outputs/flutter-apk/app-arm64-v8a-production-debug.apk" "build/app/outputs/android_artifacts/${SUF}-arm64-v8a.apk" || true
          cp "build/app/outputs/flutter-apk/app-x86_64-production-debug.apk" "build/app/outputs/android_artifacts/${SUF}-x86_64.apk" || true

      - name: Collect Android artifacts (release)
        if: needs.fetch-info.outputs.build_type != 'development' || needs.fetch-info.outputs.build_all_platforms == 'true'
        shell: bash
        run: |
          mkdir -p build/app/outputs/android_artifacts
          SUF="${{ steps.meta.outputs.artifact_suffix }}"
          cp "build/app/outputs/flutter-apk/app-armeabi-v7a-production-release.apk" "build/app/outputs/android_artifacts/${SUF}-armeabi-v7a.apk" || true
          cp "build/app/outputs/flutter-apk/app-arm64-v8a-production-release.apk" "build/app/outputs/android_artifacts/${SUF}-arm64-v8a.apk" || true
          cp "build/app/outputs/flutter-apk/app-x86_64-production-release.apk" "build/app/outputs/android_artifacts/${SUF}-x86_64.apk" || true
          mv "build/app/outputs/bundle/productionRelease/app-production-release.aab" "build/app/outputs/android_artifacts/${SUF}.aab"

      - name: Attest APKs
        if: needs.fetch-info.outputs.build_type != 'development' || needs.fetch-info.outputs.build_all_platforms == 'true'
        uses: actions/attest@v4
        with:
          subject-path: |
            build/app/outputs/android_artifacts/${{ steps.meta.outputs.artifact_suffix }}-arm64-v8a.apk
            build/app/outputs/android_artifacts/${{ steps.meta.outputs.artifact_suffix }}-armeabi-v7a.apk
            build/app/outputs/android_artifacts/${{ steps.meta.outputs.artifact_suffix }}-x86_64.apk

      - uses: actions/upload-artifact@v5
        with:
          name: oxplayer-android
          path: build/app/outputs/android_artifacts/

  build-windows:
    needs: [fetch-info]
    if: needs.fetch-info.outputs.build_type != 'development' || needs.fetch-info.outputs.build_all_platforms == 'true'
    runs-on: windows-2022
    env:
      BOT_USERNAME: ${{ secrets.BOT_USERNAME || vars.BOT_USERNAME }}
      OXPLAYER_API_BASE_URL: ${{ secrets.OXPLAYER_API_BASE_URL || vars.OXPLAYER_API_BASE_URL }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ needs.fetch-info.outputs.flutter_version }}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - run: flutter pub get

      - uses: ./.github/actions/oxplayer-flutter-env

      - name: Build Windows
        run: |
          if (Test-Path build/windows) { Remove-Item -Recurse -Force build/windows }
          flutter build windows --release `
            --build-number=${{ needs.fetch-info.outputs.android_version_code }} `
            --dart-define-from-file="$env:FLUTTER_BUILD_ENV_FILE"

      - name: Compile Inno Setup installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: windows/windows_setup.iss
          options: /O+ /DFLADDER_VERSION="${{ needs.fetch-info.outputs.version_name }}"

      - uses: actions/upload-artifact@v5
        with:
          name: oxplayer-windows-portable
          path: build\windows\x64\runner\Release\

      - uses: actions/upload-artifact@v5
        with:
          name: oxplayer-windows-installer
          path: windows\Output\fladder_setup.exe

  build-ios:
    needs: [fetch-info]
    if: needs.fetch-info.outputs.build_type != 'development' || needs.fetch-info.outputs.build_all_platforms == 'true'
    runs-on: macos-latest
    env:
      BOT_USERNAME: ${{ secrets.BOT_USERNAME || vars.BOT_USERNAME }}
      OXPLAYER_API_BASE_URL: ${{ secrets.OXPLAYER_API_BASE_URL || vars.OXPLAYER_API_BASE_URL }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ needs.fetch-info.outputs.flutter_version }}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - run: flutter pub get

      - uses: ./.github/actions/oxplayer-flutter-env

      - name: Build iOS IPA (unsigned)
        run: |
          flutter build ipa --no-codesign --flavor production \
            --build-number=${{ needs.fetch-info.outputs.android_version_code }} \
            --dart-define-from-file="$FLUTTER_BUILD_ENV_FILE"

      - name: Package unsigned IPA
        run: |
          cd build/ios/archive/Runner.xcarchive/Products/Applications/
          mkdir Payload
          mv Runner.app Payload/
          zip -r iOS.ipa Payload

      - uses: actions/upload-artifact@v5
        with:
          name: oxplayer-iOS
          path: build/ios/archive/Runner.xcarchive/Products/Applications/iOS.ipa

  build-macos:
    needs: [fetch-info]
    if: needs.fetch-info.outputs.build_type != 'development' || needs.fetch-info.outputs.build_all_platforms == 'true'
    runs-on: macos-latest
    env:
      BOT_USERNAME: ${{ secrets.BOT_USERNAME || vars.BOT_USERNAME }}
      OXPLAYER_API_BASE_URL: ${{ secrets.OXPLAYER_API_BASE_URL || vars.OXPLAYER_API_BASE_URL }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ needs.fetch-info.outputs.flutter_version }}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - run: flutter pub get

      - uses: ./.github/actions/oxplayer-flutter-env

      - name: Update CocoaPods
        run: |
          flutter build macos --config-only --flavor production \
            --dart-define-from-file="$FLUTTER_BUILD_ENV_FILE"
          cd macos
          pod install --repo-update

      - name: Build macOS app
        run: |
          flutter build macos --flavor production --release \
            --build-number=${{ needs.fetch-info.outputs.android_version_code }} \
            --dart-define-from-file="$FLUTTER_BUILD_ENV_FILE"

      - name: Ensure correct app bundle name
        run: |
          APP_DIR="build/macos/Build/Products/Release-production"
          mv "$APP_DIR/fladder.app" "$APP_DIR/Fladder.app"

      - name: Create DMG
        run: |
          brew install create-dmg
          ./scripts/create_dmg.sh

      - uses: actions/upload-artifact@v5
        with:
          name: oxplayer-macOS
          path: build/macos/Build/Products/Release-production/macOS.dmg

  build-linux:
    needs: [fetch-info]
    if: needs.fetch-info.outputs.build_type != 'development' || needs.fetch-info.outputs.build_all_platforms == 'true'
    runs-on: ubuntu-latest
    env:
      BOT_USERNAME: ${{ secrets.BOT_USERNAME || vars.BOT_USERNAME }}
      OXPLAYER_API_BASE_URL: ${{ secrets.OXPLAYER_API_BASE_URL || vars.OXPLAYER_API_BASE_URL }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ needs.fetch-info.outputs.flutter_version }}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - name: Sync pubspec build number for Linux packaging
        run: |
          sed -i -E 's/(version: [0-9]+\.[0-9]+\.[0-9]+\+)[0-9]+/\1${{ needs.fetch-info.outputs.android_version_code }}/' pubspec.yaml

      - run: flutter pub get

      - uses: ./.github/actions/oxplayer-flutter-env

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev libcurl4-openssl-dev patchelf cmake clang libfuse2

      - name: Build Linux app
        run: |
          flutter build linux --release \
            --build-number=${{ needs.fetch-info.outputs.android_version_code }} \
            --dart-define-from-file="$FLUTTER_BUILD_ENV_FILE"

      - name: Fix RPATH
        run: |
          for lib in build/linux/x64/release/bundle/lib/*.so; do
            [[ -f "$lib" && -n "$(patchelf --print-rpath "$lib")" ]] && \
            patchelf --set-rpath '$ORIGIN' "$lib"
          done
          patchelf --set-rpath '$ORIGIN/lib' "build/linux/x64/release/bundle/fladder"

      - uses: actions/upload-artifact@v5
        with:
          name: oxplayer-linux
          path: build/linux/x64/release/bundle

      - name: Build AppImage
        run: |
          VERSION_TO_USE="${{ needs.fetch-info.outputs.version_name }}"
          sed -i -E "s/(version:\\s*)latest/\\1${VERSION_TO_USE}/" AppImageBuilder.yml
          sed -i "s|PLACEHOLDER_OWNER|${{ github.repository_owner }}|g" AppImageBuilder.yml
          sed -i "s|PLACEHOLDER_REPO|${{ github.event.repository.name }}|g" AppImageBuilder.yml
          wget -O appimage-builder-x86_64.AppImage https://github.com/AppImageCrafters/appimage-builder/releases/download/v1.1.0/appimage-builder-1.1.0-x86_64.AppImage
          chmod +x appimage-builder-x86_64.AppImage
          sudo mv appimage-builder-x86_64.AppImage /usr/local/bin/appimage-builder
          appimage-builder --recipe AppImageBuilder.yml

      - uses: actions/upload-artifact@v5
        with:
          name: oxplayer-linux-appimage
          path: |
            OXPlayer_x86_64.AppImage
            OXPlayer_x86_64.AppImage.zsync

  build-linux-flatpak:
    needs: [fetch-info, build-linux]
    if: |
      needs.fetch-info.outputs.build_type == 'release' ||
      needs.fetch-info.outputs.build_type == 'nightly' ||
      needs.fetch-info.outputs.build_all_platforms == 'true'
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-46
      options: --privileged
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/download-artifact@v5
        with:
          name: oxplayer-linux
          path: build/linux/x64/release/bundle

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: OXPlayer-Linux.flatpak
          manifest-path: flatpak/nl.jknaapen.fladder.yaml

      - uses: actions/upload-artifact@v5
        with:
          name: oxplayer-linux-flatpak
          path: OXPlayer-Linux.flatpak

  create_release:
    name: Create Release
    needs:
      - fetch-info
      - build-android
      - build-windows
      - build-ios
      - build-macos
      - build-linux
      - build-linux-flatpak
    runs-on: ubuntu-latest
    if: |
      always() &&
      (needs.fetch-info.outputs.build_type == 'release' || needs.fetch-info.outputs.build_type == 'nightly') &&
      needs.fetch-info.result == 'success' &&
      needs.build-android.result == 'success' &&
      needs.build-windows.result == 'success' &&
      needs.build-ios.result == 'success' &&
      needs.build-macos.result == 'success' &&
      needs.build-linux.result == 'success' &&
      (needs.build-linux-flatpak.result == 'success' || needs.build-linux-flatpak.result == 'skipped')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        if: needs.fetch-info.outputs.build_type == 'nightly'
        with:
          fetch-depth: 0

      - id: version
        shell: bash
        run: |
          if [[ "${{ needs.fetch-info.outputs.build_type }}" == "nightly" ]]; then
            echo "version=${{ needs.fetch-info.outputs.nightly_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ needs.fetch-info.outputs.version_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete existing nightly release
        if: needs.fetch-info.outputs.build_type == 'nightly'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if gh release view ${{ env.NIGHTLY_TAG }} >/dev/null 2>&1; then
            gh release delete ${{ env.NIGHTLY_TAG }} --yes --cleanup-tag
          fi
          if git tag -l | grep -q "^${{ env.NIGHTLY_TAG }}$"; then
            git push origin --delete ${{ env.NIGHTLY_TAG }} || true
          fi

      - name: Generate nightly changelog
        if: needs.fetch-info.outputs.build_type == 'nightly'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          LATEST_STABLE=$(gh release list --limit 50 --exclude-drafts --json tagName,isPrerelease --jq '.[] | select(.isPrerelease == false) | .tagName' | head -1 || echo "")
          {
            echo "# $(date -u "+%Y-%m-%d %H:%M:%S UTC")"
            echo ""
            echo "Automated nightly build from \`main\`."
            echo ""
            echo "**Warning:** prerelease; may be unstable."
            echo ""
          } > changelog.md
          if [ -n "$LATEST_STABLE" ]; then
            echo "Changes since ${LATEST_STABLE}: https://github.com/${{ github.repository }}/compare/${LATEST_STABLE}...HEAD" >> changelog.md
          else
            echo "Commits: https://github.com/${{ github.repository }}/commits/main" >> changelog.md
          fi
          {
            echo ""
            echo "---"
            echo "Build: ${{ github.run_number }} | SHA: ${{ github.sha }}"
          } >> changelog.md

      - uses: actions/download-artifact@v5
        with:
          name: oxplayer-android
          path: oxplayer-android

      - name: Stage Android assets
        shell: bash
        run: |
          SUF="${{ needs.build-android.outputs.artifact_suffix }}"
          V="${{ steps.version.outputs.version }}"
          mv "oxplayer-android/${SUF}-armeabi-v7a.apk" "OXPlayer-Android-${V}-armeabi-v7a.apk" || true
          mv "oxplayer-android/${SUF}-arm64-v8a.apk" "OXPlayer-Android-${V}-arm64-v8a.apk" || true
          mv "oxplayer-android/${SUF}-x86_64.apk" "OXPlayer-Android-${V}-x86_64.apk" || true
          mv "oxplayer-android/${SUF}.aab" "OXPlayer-Android-${V}.aab"

      - uses: actions/download-artifact@v5
        with:
          name: oxplayer-windows-portable
          path: oxplayer-windows-portable

      - name: Stage Windows portable
        shell: bash
        run: |
          V="${{ steps.version.outputs.version }}"
          cd oxplayer-windows-portable
          zip -r "../OXPlayer-Windows-${V}.zip" .

      - uses: actions/download-artifact@v5
        with:
          name: oxplayer-windows-installer
          path: oxplayer-windows-installer

      - name: Stage Windows installer
        shell: bash
        run: |
          V="${{ steps.version.outputs.version }}"
          mv "oxplayer-windows-installer/fladder_setup.exe" "OXPlayer-Windows-${V}-Setup.exe"

      - uses: actions/download-artifact@v5
        with:
          name: oxplayer-iOS
          path: oxplayer-iOS

      - name: Stage iOS IPA
        shell: bash
        run: |
          V="${{ steps.version.outputs.version }}"
          mv "oxplayer-iOS/iOS.ipa" "OXPlayer-iOS-${V}.ipa"

      - uses: actions/download-artifact@v5
        with:
          name: oxplayer-macOS
          path: oxplayer-macOS

      - name: Stage macOS DMG
        shell: bash
        run: |
          V="${{ steps.version.outputs.version }}"
          mv "oxplayer-macOS/macOS.dmg" "OXPlayer-macOS-${V}.dmg"

      - uses: actions/download-artifact@v5
        with:
          name: oxplayer-linux
          path: oxplayer-linux

      - name: Stage Linux bundle
        shell: bash
        run: |
          V="${{ steps.version.outputs.version }}"
          cd oxplayer-linux
          zip -r "../OXPlayer-Linux-${V}.zip" .

      - uses: actions/download-artifact@v5
        if: needs.fetch-info.outputs.build_type == 'release'
        with:
          name: oxplayer-linux-flatpak
          path: oxplayer-linux-flatpak

      - name: Stage Linux Flatpak
        if: needs.fetch-info.outputs.build_type == 'release'
        shell: bash
        run: |
          V="${{ steps.version.outputs.version }}"
          mv "oxplayer-linux-flatpak/OXPlayer-Linux.flatpak" "OXPlayer-Linux-${V}.flatpak"

      - uses: actions/download-artifact@v5
        with:
          name: oxplayer-linux-appimage
          path: oxplayer-linux-appimage

      - name: Stage Linux AppImage
        shell: bash
        run: |
          V="${{ steps.version.outputs.version }}"
          mv "oxplayer-linux-appimage/OXPlayer_x86_64.AppImage" "OXPlayer-Linux-${V}.AppImage"
          mv "oxplayer-linux-appimage/OXPlayer_x86_64.AppImage.zsync" "OXPlayer-Linux-${V}.AppImage.zsync"

      - name: Prepare GitHub release body file
        shell: bash
        run: |
          if [[ "${{ needs.fetch-info.outputs.build_type }}" == "nightly" ]]; then
            cp changelog.md gh-release-body.md
          else
            printf '%s\n' "" > gh-release-body.md
          fi

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.fetch-info.outputs.build_type == 'nightly' && env.NIGHTLY_TAG || github.ref_name }}
          name: ${{ needs.fetch-info.outputs.build_type == 'nightly' && format('OXPlayer nightly — {0}', steps.version.outputs.version) || format('OXPlayer {0}', steps.version.outputs.version) }}
          body_path: gh-release-body.md
          draft: ${{ needs.fetch-info.outputs.build_type == 'release' }}
          prerelease: ${{ needs.fetch-info.outputs.build_type == 'nightly' }}
          make_latest: ${{ needs.fetch-info.outputs.build_type == 'release' }}
          generate_release_notes: ${{ needs.fetch-info.outputs.build_type == 'release' }}
          fail_on_unmatched_files: true
          files: |
            OXPlayer-Android-${{ steps.version.outputs.version }}-arm64-v8a.apk
            OXPlayer-Android-${{ steps.version.outputs.version }}-armeabi-v7a.apk
            OXPlayer-Android-${{ steps.version.outputs.version }}-x86_64.apk
            OXPlayer-Android-${{ steps.version.outputs.version }}.aab
            OXPlayer-Windows-${{ steps.version.outputs.version }}-Setup.exe
            OXPlayer-Windows-${{ steps.version.outputs.version }}.zip
            OXPlayer-iOS-${{ steps.version.outputs.version }}.ipa
            OXPlayer-macOS-${{ steps.version.outputs.version }}.dmg
            OXPlayer-Linux-${{ steps.version.outputs.version }}.zip
            OXPlayer-Linux-${{ steps.version.outputs.version }}.AppImage
            OXPlayer-Linux-${{ steps.version.outputs.version }}.AppImage.zsync
            ${{ needs.fetch-info.outputs.build_type == 'release' && format('OXPlayer-Linux-{0}.flatpak', steps.version.outputs.version) || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Notify admins (Telegram via oxplayer API)
        if: success()
        env:
          API_BASE: ${{ secrets.OXPLAYER_API_BASE_URL || vars.OXPLAYER_API_BASE_URL }}
          NOTIFY_TOKEN_PRIMARY: ${{ secrets.OXPLAYER_CLIENT_RELEASE_NOTIFY_TOKEN }}
          NOTIFY_TOKEN_FALLBACK: ${{ secrets.PROVIDER_INTERNAL_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BUILD_TYPE: ${{ needs.fetch-info.outputs.build_type }}
        shell: bash
        run: |
          NOTIFY_TOKEN="${NOTIFY_TOKEN_PRIMARY:-${NOTIFY_TOKEN_FALLBACK}}"
          if [ -z "${API_BASE}" ] || [ -z "${NOTIFY_TOKEN}" ]; then
            echo "Skipping admin release notify."
            exit 0
          fi
          if [[ "${BUILD_TYPE}" == "nightly" ]]; then
            TAG="${{ env.NIGHTLY_TAG }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          BASE="${API_BASE%/}"
          if ! JSON=$(gh release view "${TAG}" --repo "${REPO}" --json url,name,assets 2>/tmp/gh-release-view.err); then
            echo "::warning::Could not read release ${TAG}: $(cat /tmp/gh-release-view.err)"
            exit 0
          fi
          RELEASE_URL=$(echo "$JSON" | jq -r .url)
          RELEASE_NAME=$(echo "$JSON" | jq -r .name)
          ASSETS=$(echo "$JSON" | jq -c '[.assets[] | {name:.name, url:.url}]')
          BODY=$(jq -n \
            --arg releaseUrl "$RELEASE_URL" \
            --arg releaseTag "$TAG" \
            --arg releaseTitle "$RELEASE_NAME" \
            --arg buildType "$BUILD_TYPE" \
            --arg repository "$REPO" \
            --argjson assets "$ASSETS" \
            '{releaseUrl:$releaseUrl, releaseTag:$releaseTag, releaseTitle:$releaseTitle, buildType:$buildType, repository:$repository, assets:$assets}')
          HTTP_CODE=$(curl -sS -o /tmp/ox-release-notify.json -w "%{http_code}" -X POST \
            "${BASE}/internal/oxplayer-client/release-admin-notify" \
            -H "Authorization: Bearer ${NOTIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          NOTIFY_OK=$(jq -r '.ok // false' /tmp/ox-release-notify.json 2>/dev/null || echo false)
          if [ "$HTTP_CODE" != "200" ] || [ "$NOTIFY_OK" != "true" ]; then
            echo "::warning::Admin Telegram notify failed (HTTP ${HTTP_CODE})"
          else
            echo "Admin release notify sent."
          fi

  release_play_console:
    name: Upload AAB to Google Play Console
    needs:
      - fetch-info
      - create_release
      - build-android
    runs-on: ubuntu-latest
    if: |
      (needs.fetch-info.outputs.build_type == 'release' || needs.fetch-info.outputs.build_type == 'nightly') &&
      needs.create_release.result == 'success'
    concurrency:
      group: google-play-upload-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Download Artifacts Android
        uses: actions/download-artifact@v5
        with:
          name: oxplayer-android
          path: oxplayer-android

      - name: Upload AAB to Google Play Console
        uses: r0adkll/upload-google-play@v1.1.4
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: "app.oxplayer"
          releaseFiles: "oxplayer-android/${{ needs.build-android.outputs.artifact_suffix }}.aab"
          # OX: internal track until production is promoted in Play Console (Fladder uses production/draft for release).
          tracks: internal
          status: completed
          releaseName: "${{ needs.fetch-info.outputs.android_version_code }} (${{ needs.fetch-info.outputs.version_name }})"

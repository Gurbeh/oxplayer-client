# Marketing site + Privacy Policy (Google Play) on GitHub Pages.
# Site: https://gurbeh.github.io/oxplayer-client/
# Privacy: https://gurbeh.github.io/oxplayer-client/privacy-policy.html
name: Deploy website (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/privacy-policy.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Sync Play Store privacy policy HTML into static output
        run: cp docs/privacy-policy.html website/public/privacy-policy.html

      - name: Build Next.js static site
        working-directory: website
        env:
          NODE_ENV: production
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/out

      - id: deployment
        uses: actions/deploy-pages@v4

name: OXPlayer dart-define env
description: Validate OX secrets/variables and write JSON for flutter --dart-define-from-file
runs:
  using: composite
  steps:
    - name: Validate required environment
      shell: bash
      run: |
        missing=()
        for var in BOT_USERNAME OXPLAYER_API_BASE_URL; do
          [ -z "${!var:-}" ] && missing+=("$var")
        done
        if [ ${#missing[@]} -gt 0 ]; then
          echo "Missing required secrets/variables: ${missing[*]}"
          exit 1
        fi

    - name: Generate dart-defines file and bundled default.env
      shell: bash
      run: |
        python3 - <<'PY'
        import json, os
        from pathlib import Path

        def env_first(*names: str) -> str:
            for name in names:
                value = (os.environ.get(name) or "").strip()
                if value:
                    return value
            return ""

        keys = {
            "OXPLAYER": "true",
            "BOT_USERNAME": env_first("BOT_USERNAME"),
            "OXPLAYER_API_BASE_URL": env_first("OXPLAYER_API_BASE_URL"),
        }
        sentry_dsn = env_first("SENTRY_DSN")
        if sentry_dsn:
            keys["SENTRY_DSN"] = sentry_dsn
        sentry_env = env_first("SENTRY_ENVIRONMENT")
        if sentry_env:
            keys["SENTRY_ENVIRONMENT"] = sentry_env

        out = Path(os.environ["RUNNER_TEMP"]) / "flutter-build-env.json"
        out.write_text(json.dumps(keys), encoding="utf-8")

        # pubspec.yaml bundles assets/env/default.env (gitignored locally; CI must materialize it).
        env_path = Path("assets/env/default.env")
        env_path.parent.mkdir(parents=True, exist_ok=True)
        env_path.write_text(
            "\n".join(f"{k}={v}" for k, v in keys.items()) + "\n",
            encoding="utf-8",
        )
        print(f"Wrote {env_path} ({env_path.stat().st_size} bytes)")
        PY
        echo "FLUTTER_BUILD_ENV_FILE=$RUNNER_TEMP/flutter-build-env.json" >> "$GITHUB_ENV"

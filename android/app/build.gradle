plugins {
    id "com.android.application"
    id "kotlin-android"
    id "org.jetbrains.kotlin.plugin.compose"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Semantic version + versionCode derived from pubspec.yaml (decoupled from +N build suffix).
def pubspecFile = file('../../pubspec.yaml')
if (!pubspecFile.exists()) {
    throw new GradleException("pubspec.yaml not found at ${pubspecFile.absolutePath}")
}
def pubspecVersionMatcher = pubspecFile.text =~ /(?m)^version:\s*(\d+)\.(\d+)\.(\d+)/
if (!pubspecVersionMatcher.find()) {
    throw new GradleException("Could not parse semantic version from pubspec.yaml (expected format: version: M.m.p+N)")
}
def major = pubspecVersionMatcher.group(1).toInteger()
def minor = pubspecVersionMatcher.group(2).toInteger()
def patch = pubspecVersionMatcher.group(3).toInteger()
def semanticVersionName = "${major}.${minor}.${patch}"
def computedVersionCode = (major * 100000) + (minor * 1000) + patch
if (computedVersionCode < 100001) {
    throw new GradleException(
            "computedVersionCode ${computedVersionCode} is below minimum 100001. " +
                    "Bump pubspec.yaml semantic version (formula: major*100000 + minor*1000 + patch)."
    )
}

android {
    packaging {
        jniLibs {
            // media_kit sets extractNativeLibs=true; align with Play-safe extraction for
            // mixed plugin .so sets (MPV, FFmpeg) on mid-tier ARM devices.
            useLegacyPackaging = true
            excludes += ["lib/x86/**"]
            // libc++_shared is shared across media_kit, fvp/mdk, and other JNI deps.
            pickFirsts += [
                    "lib/x86_64/libc++_shared.so",
                    "lib/arm64-v8a/libc++_shared.so",
                    "lib/armeabi-v7a/libc++_shared.so",
            ]
            // Do not pickFirst libass/libffmpeg here: media_kit and fvp/mdk ship different
            // builds; release merges were keeping media_kit's copy and crashing fvp JNI_OnLoad.
        }
    }
    namespace = "app.oxplayer"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        // Required for java 8+ library desugaring (flutter_local_notifications and others)
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        compose = true
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId = "app.oxplayer"
        minSdkVersion flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = computedVersionCode
        versionName = semanticVersionName

        // Do NOT set ndk.abiFilters here: `flutter build apk --split-per-abi` (CI) already
        // configures splits.abi (armeabi-v7a, arm64-v8a, x86_64) and Gradle fails if both exist.
        // Exclude broken 32-bit x86 via packaging.jniLibs.excludes (see tool/android/verify_native_abi_parity.dart).
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.6.4'
    }

    signingConfigs {
        release {
            storeFile file('keystore.jks')
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storePassword keystoreProperties['storePassword']
        }
    }
    buildTypes {
        debug {
            // For faster local debug on arm64 only: flutter run --target-platform android-arm64
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.release

            packagingOptions {
                resources {
                    excludes += ["assets/dexopt/baseline.prof", "assets/dexopt/baseline.profm"]
                }
            }
        }
    }

    flavorDimensions "default"
    productFlavors {
        development {
            dimension "default"
            applicationIdSuffix ".dev"
        }
        production {
            dimension "default"
            applicationIdSuffix ""
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2025.12.00')
    implementation composeBom
    androidTestImplementation composeBom
    implementation('androidx.compose.material3:material3')
    implementation('androidx.compose.ui:ui-tooling-preview')
    debugImplementation('androidx.compose.ui:ui-tooling')
    implementation('androidx.activity:activity-compose:1.12.1')

    // Required for Java 8+ desugaring used by some libraries
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    // Media3 (ExoPlayer)
    def media3_version = "1.8.0+1"
    implementation("androidx.media3:media3-exoplayer:$media3_version")
    implementation("androidx.media3:media3-session:$media3_version")
    implementation("androidx.media3:media3-ui:$media3_version")

    implementation("androidx.media3:media3-exoplayer-dash:$media3_version")
    implementation("androidx.media3:media3-exoplayer-hls:$media3_version")
    implementation("org.jellyfin.media3:media3-ffmpeg-decoder:$media3_version")
    implementation("io.github.peerless2012:ass-media:0.3.0")

    //UI
    implementation("io.github.rabehx:iconsax-compose:0.0.5")
    implementation("io.coil-kt.coil3:coil-compose:3.3.0")
    implementation("io.coil-kt.coil3:coil-network-okhttp:3.3.0")
    implementation("com.materialkolor:material-kolor:4.0.5")
}

// FvpPlugin loads broken release MDK JNI at class init (SIGSEGV before Dart runs). Android uses MPV by default.
def stripFvpFromPluginRegistrant = tasks.register("stripFvpFromPluginRegistrant") {
    doLast {
        def registrant = file("src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java")
        if (!registrant.exists()) {
            return
        }
        def text = registrant.text
        if (!text.contains("com.mediadevkit.fvp.FvpPlugin")) {
            return
        }
        def patched = text.replaceAll(
                /(?s)\s*try \{\s*flutterEngine\.getPlugins\(\)\.add\(new com\.mediadevkit\.fvp\.FvpPlugin\(\)\);\s*\} catch \(Exception e\) \{\s*Log\.e\(TAG, "Error registering plugin fvp[^"]*", e\);\s*\}/,
                "\n    // OXPlayer: FvpPlugin omitted on Android (release MDK JNI crashes at JNI_OnLoad; use MPV)."
        )
        if (patched != text) {
            registrant.write(patched)
            logger.lifecycle("OXPlayer: stripped FvpPlugin from GeneratedPluginRegistrant.java")
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn stripFvpFromPluginRegistrant
}
